<header id="nav-background" class="w-80-l w-100 mw8 ph2 center body-container max-width-1440"> 
  
  <div class="bg--primary v-mid center"> 
      
  <div id="nav-links--desktop" class="nav-links dib mr3 mr1-l v-mid tr fr w-75 pv4">
    {% for item in site.data.navigation.mypages %}
        <a class="white ph3{% if item.url == page.url %} active{% endif %}" href="{{item.url}}">{{item.title}}</a>
    {% endfor %}
  </div>

  <div class="nav-links__favicon w-25 pv1" > 
    <!-- <a class="link dim tl-l mb2 mb0-l z-5" href="http://127.0.0.1:4000\index.html" title="Home">corey mines</a>  -->
    <a class="link dim tl-l mb2 mb0-l z-5" style="font-size:1.1rem;" href="http://127.0.0.1:4000\index.html" title="Home">
    <img src="{{ site.baseurl }}/img/cmd-icon.png" class="ma0 pa0 v-mid navigation-logo__avatar"></a> 
  </div>   
    
  <input id="burger" type="checkbox" style="display:none;"> 
    <label for="burger" id="burger-menu"> 
      <span class="bar-change" style="margin-top:1px;"></span> 
      <span class="bar-change" style="margin-top:1px;"></span>   
      <span class="bar-change" style="margin-top:1px;"></span> 
    </label> 
  </input> 

  <div class="mobile-logo__alt">
      <a class="link dim tl-l mb2 mb0-l" style="font-size:1.1rem;" href="http://127.0.0.1:4000\index.html" title="Home">
        <img src="{{ site.baseurl }}/img/cmd-icon.png" class="" style="z-index: 100; margin-bottom:0px; width: 60px; position: absolute; top: 16px; right: 16px;">
      </a>
    </div>
          
  <nav id="nav-links" style="display:none"> 
    <div class="">
      <a class="link dim tl-l mb2 mb0-l z-5" style="font-size:1.1rem;" href="http://127.0.0.1:4000\index.html" title="Home">
        <img src="{{ site.baseurl }}/img/cmd-icon.png" class="nav-links__avatar v-mid" style="width: 100px; display:none; position: absolute; bottom: 35px; left: 24px;">
      </a> 
    </div>

    <ul class="pl4" style="margin-top:5em;"> 
      {% for item in site.data.navigation.mypages %}
        {% if item.id %}
            <li style="list-style:none !important;">
              <a class="dim pl4" href="{{item.url}}">{{item.title}}</a>
            </li> 
        {% endif  %}
      {% endfor %}
    </ul> 
  </nav> 

  </div> 

</header>
