<section class="w-70-l w-100 ph6-l ph2 pb6-l pb6 mw-custom--default center v-mid pt5-l bg--primary" style="min-height:85vh; align-content:center;"> 
  <div class="pt2  pb2-l"> 

    {% for item in site.data.page-copy.pagecontent %}
      {% if item.pagetitle == "homepage" %}
        <div class="h-100 w-100-l w-100-m w-100 pr4-l pr0"> 
          <h3 class="revealopacity1 pb2"> <span class="gray">—</span> Hi, I'm Corey</h3> 
          <h1 class="pb2">{{item.title-2__alt}}</h1> 
          <h3 class="pb2">{{item.title-3__alt}} {{item.title-4}}</h3> 
          <!-- <h3 class="pb2">{{item.title-5}}</h3>  -->
          <!-- <p class="pb2">{{item.body-1}}</p> -->
          <p class="pb2">{{item.body-2}}</p>



        <!-- Remote Location Callout -->
        <section class="availability-container pt4-l pt2">
          <div class="availability-parent-container ">
            <div class="availability-child-container">
              <svg xmlns="http://www.w3.org/2000/svg" width="8" height="8" viewBox="0 0 8 8" fill="none">
                <circle cx="4" cy="4" r="4" fill="#6CB775"/>
              </svg>
              <p class="location-text">Fully-remote based in Boise, Idaho</p>
            </div>
          </div>
        </section> 
      {% endif %}
    {% endfor %}
    
    </div>
  </div>
</section>
