pagecontent:

- pagetitle: homepage
  title-1: Hola, I'm Corey
  title-2: I am a Staff Product Designer at <a href="https://www.cnn.com" target="_blank" rel="noopener" class="underline dim">CNN</a>, working to enhance and scale our <a href="https://www.designexecutivecouncil.com/insights/design-driven-culture-change-elevating-cnns-digital-experience" target="_blank" rel="noopener" class="underline dim">Design System Language</a>.
  title-2__alt: <span class="highlight">Staff Product Designer</span> and Systems Designer with over 12 years experience in UX & interface design, prototyping, and user research. 
  title-3__alt: Currently at <a href="https://www.cnn.com" target="_blank" rel="noopener" class="underline dim">CNN</a>, working to enhance and scale our <a href="https://www.designexecutivecouncil.com/insights/design-driven-culture-change-elevating-cnns-digital-experience" target="_blank" rel="noopener" class="underline dim">Design System</a>.
  title-3: Delivery-focused Staff Product Designer with over 12 years of hands-on experience crafting engaging, immersive, digital product experiences across Web, Mobile App and Connected TV.
  title-4: Laser-focused on launching an end-to-end Figma to code pipeline, empowering designers to publish and maintain accessible design systems at scale.
  title-5: Design hand-off demystified ✨ 
  body-1: These days, you can find me diving head-first into CNN’s design system language that establishes and informs immersive, rich story-telling experiences delivered to users across the globe.
  body-2: Prior to design systems, I led product design initiatives for a range of products in video, community, e-commerce and a variety of funded 0:1 products. I thrive in ambiguity, and love sinking my teeth into a rich problem space that puts me out of my comfort zone.
  body-3: This work taken me around the world and back, spanning a number of industries, verticals, and focus-areas across responsive web, mobile apps and connected TV. Life is a garden, so dig it... err... lemons, lemonade.
  pills: 
    - Available for Work
    - Design Systems
    - 0:1 Products 

